<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Hub</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18254b,#0b1020 55%);min-height:100vh}.wrap{max-width:560px;margin:auto;padding:24px}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:22px;backdrop-filter:blur(18px);box-shadow:0 18px 60px rgba(0,0,0,.25)}h1{margin:0 0 8px;font-size:28px}p{color:#aeb8d6;line-height:1.55}.label{display:block;margin:18px 0 8px;color:#c9d2ec;font-size:13px}input{width:100%;padding:15px;border-radius:16px;border:1px solid #313b59;background:#11182d;color:#fff;outline:none}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#6d7cff,#7a4dff);color:white;font-weight:800;cursor:pointer}.status{margin-top:15px;padding:13px;border-radius:14px;background:#11182d;color:#cbd5e1;white-space:pre-wrap}.ok{color:#76efaa}.err{color:#ff8d9c}.mini{margin-top:18px;font-size:12px;color:#8f9bb9}</style></head><body><div class="wrap"><div class="card"><h1>🚀 Master Hub</h1><p>Crea y administra tus bots hijos desde Telegram.</p><label class="label">Token de @BotFather</label><input id="token" type="password" placeholder="123456:ABC..."><button id="create">Crear bot</button><div id="status" class="status">Esperando...</div><div class="mini">El token se valida con Telegram y se almacena cifrado. Nunca se muestra en los logs.</div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){try{tg.ready();tg.expand();}catch(e){}}const launch=new URLSearchParams(location.search).get('launch')||new URLSearchParams(location.hash.replace(/^#/,'' )).get('launch')||'';const status=document.getElementById('status');document.getElementById('create').onclick=async()=>{status.textContent='Validando y activando...';status.className='status';try{const token=document.getElementById('token').value.trim();const r=await fetch('/api/master/create-bot',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'','Authorization':tg?.initData?`tma ${tg.initData}`:'','X-Mini-App-Launch-Token':launch},body:JSON.stringify({token})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'No se pudo crear');status.textContent=`✅ Bot activo\n@${d.username||d.bot_id}\nID: ${d.bot_id}`;status.className='status ok';document.getElementById('token').value='';}catch(e){status.textContent='❌ '+e.message;status.className='status err';}};
</script></body></html>
