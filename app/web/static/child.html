<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multimedia Hub</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#090d19}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#131d38,#090d19 70%);min-height:100vh}.wrap{max-width:600px;margin:auto;padding:16px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 16px}.brand{font-size:22px;font-weight:900}.pill{font-size:11px;padding:7px 10px;border-radius:999px;background:#14203a;color:#76efaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:16px}.wide{grid-column:1/-1}.title{font-weight:800;margin-bottom:8px}.muted{color:#9aa7c4;font-size:13px;line-height:1.45}.room{margin-top:10px;padding:14px;border-radius:18px;background:#10182b;border:1px solid #1d2944}.empty{text-align:center;padding:28px;color:#8e99b4}.err{color:#ff98a7}</style></head><body><div class="wrap"><div class="top"><div class="brand">🎬 Hub</div><div class="pill">Online</div></div><div class="grid"><div class="card"><div class="title">🏠 Mis salas</div><div id="mine" class="muted">Cargando...</div></div><div class="card"><div class="title">🌎 Públicas</div><div id="public" class="muted">Cargando...</div></div><div class="card wide"><div class="title">🛡️ Privacidad</div><div class="muted">Las publicaciones de las salas se redistribuyen sin mostrar el remitente. El servicio puede procesar contenido para seguridad y moderación.</div></div></div></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}const p=new URLSearchParams(location.search),botId=p.get('bot_id');const h={'X-Telegram-Init-Data':tg?.initData||''};async function load(){try{const r=await fetch('/api/child/rooms?bot_id='+encodeURIComponent(botId),{headers:h});const d=await r.json();if(!r.ok)throw new Error(d.detail||'No autorizado');render('mine',d.mine||[]);render('public',d.public||[]);}catch(e){document.getElementById('mine').innerHTML='<span class="err">'+e.message+'</span>';document.getElementById('public').textContent='';}}function render(id,rooms){const el=document.getElementById(id);if(!rooms.length){el.innerHTML='<div class="empty">No hay salas.</div>';return;}el.innerHTML=rooms.slice(0,10).map(r=>`<div class="room"><b>${esc(r.name||'Sala')}</b><div class="muted">${Number(r.member_count||0)} miembros · ${r.visibility||''}</div></div>`).join('')}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}load();
</script></body></html>
