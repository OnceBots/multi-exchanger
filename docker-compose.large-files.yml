# Overlay para habilitar descargas sin límite de tamaño del Bot API y cargas de
# hasta 2000 MB. La API queda solo en la red interna de Docker; no publicar 8081.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?Configura TELEGRAM_API_ID en .env}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?Configura TELEGRAM_API_HASH en .env}"
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
    volumes:
      - telegram-bot-api-data:${TELEGRAM_API_SERVER_FILES_ROOT:-/var/lib/telegram-bot-api}
    expose:
      - "8081"
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  app:
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_API_LOCAL_MODE: "true"
      TELEGRAM_API_TIMEOUT_SECONDS: "7200"
      TELEGRAM_API_SERVER_FILES_ROOT: "${TELEGRAM_API_SERVER_FILES_ROOT:-/var/lib/telegram-bot-api}"
      TELEGRAM_API_HOST_FILES_ROOT: "${TELEGRAM_API_HOST_FILES_ROOT:-/srv/tg-bot-api-data}"
      VIDEO_RAMDISK_PATH: /mnt/ramdisk
      VIDEO_REQUIRE_TMPFS: "true"
      MEDIA_PACKAGE_MAX_BYTES: "1887436800"
      VIDEO_MAX_UPLOAD_BYTES: "1950000000"
    volumes:
      - telegram-bot-api-data:${TELEGRAM_API_HOST_FILES_ROOT:-/srv/tg-bot-api-data}:ro
    tmpfs:
      - /mnt/ramdisk:size=536870912,mode=1777

volumes:
  telegram-bot-api-data:
