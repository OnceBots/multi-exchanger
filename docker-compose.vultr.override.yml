# Usar cuando la app Python y el Telegram Bot API local corren en contenedores separados.
# Conecta el contenedor existente del Bot API a la red externa multiexchanger-botapi
# con alias DNS: telegram-bot-api.
services:
  app:
    restart: unless-stopped
    networks:
      - default
      - bot-api-net
    environment:
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_API_LOCAL_MODE: "true"
      TELEGRAM_API_SERVER_FILES_ROOT: /var/lib/telegram-bot-api
      TELEGRAM_API_HOST_FILES_ROOT: /srv/tg-bot-api-data
      VIDEO_RAMDISK_PATH: /mnt/ramdisk
      VIDEO_REQUIRE_TMPFS: "true"
    volumes:
      - /mnt/ramdisk:/mnt/ramdisk
      - /root/tg-bot-api/data:/srv/tg-bot-api-data:ro

networks:
  default: {}
  bot-api-net:
    external: true
    name: multiexchanger-botapi
